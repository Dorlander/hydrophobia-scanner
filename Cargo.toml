[package]
name = "firmware-audit"
version = "0.1.0"
edition = "2021"
authors = ["Vladimir <xenophobiaks@gmail.com>"]
description = "Defensive scanner for exposed signing certificates in Secure Boot db (CVE-2025-11577 class) and Insyde H2O Hydroph0bia (CVE-2025-4275) indicators."
license = "Apache-2.0"
repository = "https://github.com/Dorlander/firmware-audit"
readme = "README.md"
keywords = ["uefi", "secure-boot", "firmware", "audit", "security"]
categories = ["command-line-utilities", "os"]

[dependencies]
anyhow     = "1"
clap       = { version = "4.5", features = ["derive"] }
hex        = "0.4"
sha2       = "0.10"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
x509-parser = "0.15"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
opt-level     = "z"
